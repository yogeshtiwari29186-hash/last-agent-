name: YouTube SEO Audit

on:
  push:
    branches: [main]
    paths:
      - 'src/seo_audit.py'
      - 'tests/**'
      - '.github/workflows/youtube-seo-audit.yml'
      - 'requirements.txt'
  schedule:
    - cron: "0 12 * * *" # Daily at 12:00 UTC / 17:30 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-seo-audit
  cancel-in-progress: false

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Run read-only YouTube SEO audit
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m src.seo_audit --output-dir reports

      - name: Upload JSON and HTML reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: youtube-seo-audit-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
