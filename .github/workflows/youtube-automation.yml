name: YouTube Automation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        type: choice
        options: [validate, prepare]
        default: validate
  schedule:
    - cron: '0 12 * * *' # 17:30 India time

permissions:
  contents: read

concurrency:
  group: youtube-automation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate setup
        run: python -m src.pipeline validate
      - name: Prepare draft (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare' }}
        run: python -m src.pipeline prepare
      - name: Upload draft artifact if present
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare' }}
        uses: actions/upload-artifact@v4
        with:
          name: youtube-draft
          path: output/
          if-no-files-found: ignore
          retention-days: 7
